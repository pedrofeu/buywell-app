name: Gerar APK do BuyWell

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependências (Capacitor)
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: |
          npx cap add android
          python3 nativo/preparar_android.py
          npx cap sync android

      - name: Chave fixa (para o APK novo instalar por cima do antigo)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nomear o APK
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk "saida/BuyWell-0.3-$(date +%Y%m%d-%H%M).apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: BuyWell-APK
          path: saida/*.apk
          retention-days: 30
